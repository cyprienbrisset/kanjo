name: Desktop

# Compile le client lourd sur les 3 OS. Compile-gate sur PR touchant gui/wails ;
# artefacts publiés sur tag v*. Signature opt-in (secrets), sinon artefacts non signés.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["gui/wails/**", "gui/frontend/**", "internal/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            buildtags: ""
          - os: windows-latest
            platform: windows/amd64
            buildtags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            # Ubuntu 24.04 fournit WebKitGTK 4.1 ; Wails cible 4.0 par défaut → tag requis.
            buildtags: "webkit2_41"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Dépendances Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Installer Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: go mod tidy (module wails)
        working-directory: gui/wails
        run: go mod tidy
      - name: Build
        working-directory: gui/wails
        shell: bash
        run: |
          if [ -n "${{ matrix.buildtags }}" ]; then
            wails build -platform ${{ matrix.platform }} -tags "${{ matrix.buildtags }}"
          else
            wails build -platform ${{ matrix.platform }}
          fi
      - name: Publier l'artefact (compile-gate + tag)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kanjo-desktop-${{ matrix.os }}
          path: gui/wails/build/bin/*
